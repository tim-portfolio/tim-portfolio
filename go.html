<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Opening Tim Zhang Portfolio</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2523;
      --muted: #676f6a;
      --line: #dfded6;
      --brand: #b45534;
      --bg: #f7f5ef;
      --panel: #fffefa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(560px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 28px;
      box-shadow: 0 18px 45px rgba(31, 37, 35, 0.08);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }

    .status {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 18px 0 22px;
      font-size: 14px;
      color: var(--ink);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--brand);
      animation: pulse 1.1s ease-in-out infinite;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    a {
      color: inherit;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 15px;
      border-radius: 6px;
      border: 1px solid var(--line);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .button-primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.45; transform: scale(0.92); }
      50% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <main>
    <h1>Opening Portfolio</h1>
    <p>正在打开张威健（Tim Zhang）的个人主页。页面会优先尝试 GitHub Pages；如果当前网络不可达，会留在镜像站。</p>
    <div class="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="status">Checking the global portfolio link...</span>
    </div>
    <div class="actions">
      <a class="button button-primary" id="mirror-link" href="./">Open Mirror</a>
      <a class="button" id="global-link" href="https://tim-portfolio.github.io/tim-portfolio/">Open Global Link</a>
    </div>
  </main>

  <script>
    (function () {
      const globalBase = "https://tim-portfolio.github.io/tim-portfolio/";
      const isFile = window.location.protocol === "file:";
      const mirrorBase = isFile ? "index.html" : `${window.location.origin}/`;
      const section = window.location.hash || "";
      const globalTarget = `${globalBase}${section}`;
      const mirrorTarget = `${mirrorBase}${section}`;
      const timeoutMs = 1800;

      const status = document.getElementById("status");
      const mirrorLink = document.getElementById("mirror-link");
      const globalLink = document.getElementById("global-link");

      mirrorLink.href = mirrorTarget;
      globalLink.href = globalTarget;

      const goMirror = () => {
        status.textContent = "Global link is unavailable here. Opening the mirror...";
        window.location.replace(mirrorTarget);
      };

      const controller = new AbortController();
      const timeout = window.setTimeout(() => {
        controller.abort();
        goMirror();
      }, timeoutMs);

      fetch(globalBase, {
        mode: "no-cors",
        cache: "no-store",
        signal: controller.signal
      }).then(() => {
        window.clearTimeout(timeout);
        status.textContent = "Global link is reachable. Opening GitHub Pages...";
        window.location.replace(globalTarget);
      }).catch(() => {
        window.clearTimeout(timeout);
        goMirror();
      });
    }());
  </script>
</body>
</html>
